{% extends "base.html" %}
{% block title %}{{ error.code }} · HourPlan{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-md text-center">
  <p class="text-sm font-semibold text-brand-600">{{ error.code }}</p>
  <h1 class="mt-2 text-2xl font-semibold text-ink">{% block heading %}Algo salió mal{% endblock %}</h1>
  <p class="mt-3 text-ink-muted">{% block message %}No pudimos completar la solicitud.{% endblock %}</p>
  <a href="{{ url_for('main.index') }}" class="mt-6 inline-block rounded-md bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700">Volver al inicio</a>
</div>
{% endblock %}
