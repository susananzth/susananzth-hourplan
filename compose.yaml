name: hourplan

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hourplan}:${POSTGRES_PASSWORD:-hourplan}@db:5432/${POSTGRES_DB:-hourplan}

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hourplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hourplan}
      POSTGRES_DB: ${POSTGRES_DB:-hourplan}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      HOURPLAN_ENV: ${HOURPLAN_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Development server, tests and linters (code mounted from the host).
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      HOURPLAN_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hourplan}:${POSTGRES_PASSWORD:-hourplan}@db:5432/hourplan_test
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  # Rebuilds CSS on template changes while developing.
  assets:
    profiles: [dev]
    image: node:24.22.2-alpine3.24
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"

volumes:
  pgdata:
