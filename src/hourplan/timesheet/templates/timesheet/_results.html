{% for target in found %}
<li>
  <button type="submit" name="nueva" value="{{ encode_key(target.key) }}" class="block w-full rounded-md px-3 py-2 text-left text-sm text-ink hover:bg-surface focus-visible:outline-2 focus-visible:outline-brand-600">{{ target.label }}</button>
</li>
{% else %}
<li class="px-3 py-2 text-sm text-ink-muted">Sin resultados.</li>
{% endfor %}
