name: hourplan

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hourplan}:${POSTGRES_PASSWORD:-hourplan}@db:5432/${POSTGRES_DB:-hourplan}

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hourplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hourplan}
      POSTGRES_DB: ${POSTGRES_DB:-hourplan}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      HOURPLAN_ENV: ${HOURPLAN_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Development server, tests and linters (code mounted from the host).
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      HOURPLAN_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hourplan}:${POSTGRES_PASSWORD:-hourplan}@db:5432/hourplan_test
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  # Rebuilds CSS on template changes while developing.
  assets:
    profiles: [dev]
    image: node:24.22.2-alpine3.24
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"

  # E2E: the app on its own throwaway database, filled with the fictitious demo data.
  e2e-app:
    profiles: [e2e]
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOURPLAN_ENV: development
      SECRET_KEY: e2e-only-not-a-secret
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hourplan}:${POSTGRES_PASSWORD:-hourplan}@db:5432/hourplan_e2e
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && flask seed && flask demo-data
      && flask create-user --email admin@example.test --name 'Ana Demo' --role admin --role pm
      --password e2e-clave-larga-123 && flask link-resource admin@example.test
      && flask run --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      db:
        condition: service_healthy

  # Headless Chromium (official Playwright image, version pinned to the pip package).
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    ipc: host
    init: true
    working_dir: /e2e
    environment:
      BASE_URL: http://e2e-app:8000
      SCREENSHOTS_DIR: /capturas
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
    volumes:
      - ./tests/e2e:/e2e:ro
      - ./docs/capturas:/capturas
    command: >
      sh -c "pip install -q --break-system-packages playwright==1.64.1 pytest pytest-playwright
      && pytest -p no:cacheprovider -q ${E2E_ARGS:-.};
      status=$$?; chown -R $$HOST_UID:$$HOST_GID /capturas; exit $$status"
    depends_on:
      e2e-app:
        condition: service_healthy

  # --- Voice dictation (ADR-006). Profiles: voice (STT + worker), voice-llm (optional LLM).
  # Set VOICE_STT_URL=http://whisper:8080 (and VOICE_LLM_URL=http://llm:8080) in .env so that
  # web and voice-worker both see them. No ports are published: only the internal network.
  # Images are pinned by digest (tags: whisper.cpp "main", llama.cpp "server", 2026-11-08).
  whisper:
    profiles: [voice]
    image: ghcr.io/ggml-org/whisper.cpp@sha256:168d3bf105f243aad646079adffe59875f937c9e29a64d91d9aa03669f85bc08
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    command:
      - >-
        whisper-server --host 0.0.0.0 --port 8080 -l es
        -m /models/${VOICE_STT_FILE:-ggml-small.bin}
        --inference-path /v1/audio/transcriptions
    volumes:
      - voice-models:/models:ro

  voice-worker:
    profiles: [voice]
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      HOURPLAN_ENV: ${HOURPLAN_ENV:-production}
    command: ["flask", "voice-worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started

  llm:
    profiles: [voice-llm]
    image: ghcr.io/ggml-org/llama.cpp@sha256:ca40726778c25a7fadce42c09bada8484eab22e28bc283bdbf212e87b1555390
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    command: ["-m", "/models/${VOICE_LLM_FILE:-llm.gguf}", "--ctx-size", "4096"]
    volumes:
      - voice-models:/models:ro

  # One-off: downloads a model into the voice-models volume and checks its SHA-256.
  voice-models:
    profiles: [voice-models]
    build:
      context: .
      target: runtime
    user: root
    environment:
      <<: *database-url
      # Only the download runs here; development mode supplies a throwaway SECRET_KEY.
      HOURPLAN_ENV: development
      VOICE_MODELS_DIR: /models
    volumes:
      - voice-models:/models

volumes:
  pgdata:
  voice-models:
