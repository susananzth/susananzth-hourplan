[project]
name = "hourplan"
version = "0.1.0"
description = "Lightweight portfolio planning, time tracking and plan-vs-actual reporting."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "flask~=3.1.3",
  "sqlalchemy~=2.1.7",
  "alembic~=1.20",
  "psycopg[binary]~=3.3",
  "flask-login~=0.6.3",
  "flask-wtf~=1.3",
  "flask-limiter~=4.1",
  "argon2-cffi~=25.1",
  "pydantic~=2.14",
  "openpyxl~=3.1",
  "gunicorn~=26.2",
  "httpx~=0.28",
]

[dependency-groups]
dev = [
  "ruff~=0.17.3",
  "mypy~=2.4",
  "types-wtforms>=3.3",
  "types-openpyxl>=3.1",
  "import-linter~=2.15",
  "pip-audit~=2.10",
  "pre-commit~=4.7",
  "pytest~=9.2",
  "pytest-cov~=7.1",
  "pytest-xdist~=3.8",
  "pytest-socket~=0.8",
]

[build-system]
requires = ["hatchling~=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hourplan"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "N", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "DTZ001"]
"migrations/**" = ["N999", "E501"]
"src/hourplan/shared/locales.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["hourplan"]

[[tool.mypy.overrides]]
module = ["flask_login", "flask_login.*", "flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hourplan.auth.forms", "hourplan.auth.models", "hourplan.admin.forms"]
disallow_subclassing_any = false

# ---------------------------------------------------------------- pytest
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
norecursedirs = ["e2e"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["hourplan"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "hourplan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services do not depend on Flask"
type = "forbidden"
source_modules = ["hourplan.*.services"]
forbidden_modules = ["flask", "flask_login", "flask_wtf", "hourplan.extensions"]

[[tool.importlinter.contracts]]
name = "Models do not depend on services or routes"
type = "forbidden"
source_modules = ["hourplan.*.models"]
forbidden_modules = ["hourplan.*.services", "hourplan.*.routes", "flask"]

# Higher layers may import lower ones, never the reverse; "|" = independent siblings.
# Across features there are only foreign keys by table name, no ORM relationships.
[[tool.importlinter.contracts]]
name = "Feature layers"
type = "layers"
layers = [
  "hourplan.main | hourplan.health | hourplan.setup | hourplan.admin | hourplan.imports | hourplan.timer | hourplan.voice | hourplan.ailog",
  "hourplan.reports",
  "hourplan.planning | hourplan.agile",
  "hourplan.timesheet",
  "hourplan.projects",
  "hourplan.catalogs | hourplan.policies | hourplan.resources",
  "hourplan.auth",
  "hourplan.audit",
]
